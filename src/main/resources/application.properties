spring.application.name=assignmentBNIAnggie

spring.datasource.url=jdbc:mysql://localhost:3306/crud_spring_boot?allowPublicKeyRetrieval=true&useSSL=false
#spring.datasource.url=jdbc:mysql://host.docker.internal:3306/crud_spring_boot?allowPublicKeyRetrieval=true&useSSL=false
spring.datasource.username=root
spring.datasource.password=root

spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.hibernate.ddl-auto=update

# Pattern dengan Nama Method (%M) dan Garis Baris (%L)
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36}.%M:%L - %msg%n
logging.pattern.file=%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36}.%M:%L - %msg%n
#server.port=3360

## Nama file log di dalam container Docker
#logging.file.name=/logs/bank-assignment.log
